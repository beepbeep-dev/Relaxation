<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Relaxation — Kaisei</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#127961;</text></svg>"
    />
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #05060b; }
      body {
        font: 400 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #e8ecf5;
      }
      canvas { display: block; }

      #boot {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px; text-align: center; padding: 32px;
        background: radial-gradient(120% 90% at 50% 15%, #16233f 0%, #080a12 55%, #04050a 100%);
        transition: opacity .8s ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot h1 {
        font-size: clamp(30px, 7vw, 54px); font-weight: 200; letter-spacing: .42em;
        text-indent: .42em; color: #fff;
      }
      #boot .sub { color: #8b9ab8; letter-spacing: .22em; text-transform: uppercase; font-size: 12px; }
      #bar { width: min(320px, 70vw); height: 2px; background: #1e293f; overflow: hidden; }
      #bar i { display: block; height: 100%; width: 0%; background: #ff7a45; transition: width .3s ease; }
      #enter {
        appearance: none; border: 1px solid #ff7a45; background: transparent; color: #ff9c6e;
        padding: 14px 34px; font: inherit; letter-spacing: .2em; text-transform: uppercase;
        font-size: 13px; cursor: pointer; transition: background .2s, color .2s; border-radius: 2px;
      }
      #enter:hover:not(:disabled) { background: #ff7a45; color: #120a06; }
      #enter:disabled { opacity: .35; cursor: default; border-color: #44506a; color: #8b9ab8; }
      #hint { color: #6d7c99; font-size: 13px; max-width: 42ch; }
    </style>
  </head>
  <body>
    <div id="boot">
      <h1>KAISEI</h1>
      <div class="sub">Relaxation</div>
      <div id="bar"><i></i></div>
      <button id="enter" disabled>Loading</button>
      <p id="hint">Open this page in the Quest 3 browser and press Enter VR. On desktop: WASD to walk, mouse to look, click to capture.</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
