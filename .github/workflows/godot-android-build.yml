name: Godot Android APK

# Builds godot/ into a Quest-installable .apk.
#
# Unlike the Unity path this replaced, THIS WORKFLOW NEEDS NO SECRETS AND NO
# ACCOUNT. Godot is MIT-licensed: no login, no license file, no activation
# step, for the editor or for anything it builds. Every input is fetched from
# a public URL at build time. Click "Run workflow" and download the artifact.
#
# The debug keystore is generated in-workflow. Android refuses to install an
# unsigned APK, but a *debug*-signed one installs fine via adb/SideQuest,
# which is what sideloading to a Quest wants. Publishing to a store later
# needs a real release keystore, which is the only point a secret enters —
# and that is a store requirement, not an engine one.

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-android-build.yml'

env:
  GODOT_VERSION: 4.3
  # Godot's own release naming; the export templates must match the editor
  # version exactly or the export silently falls back and fails.
  GODOT_RELEASE: stable

# Pushing twice in quick succession otherwise leaves two runs racing, both
# pulling ~1GB of engine and templates from the same CDN — which is how the
# download started failing with "Connection died" in the first place. Only
# the newest commit is worth building.
concurrency:
  group: godot-android
  cancel-in-progress: true

jobs:
  build:
    name: Export APK
    runs-on: ubuntu-latest
    # A headless Godot command that decides to wait for something will wait
    # forever, and the default job timeout is six hours of billed runner
    # time reporting nothing. Twenty-five minutes is generous for a gradle
    # build from a warm SDK and turns a hang into a fast, legible failure.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build-tools and platform
        run: |
          sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"

      # Cached so a rerun does not re-pull ~1GB from the release CDN. The key
      # is the exact version, so bumping GODOT_VERSION fetches fresh rather
      # than silently building against a stale engine.
      - name: Cache Godot download
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Download Godot ${{ env.GODOT_VERSION }} and export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          mkdir -p ~/godot-dl

          # --retry with --retry-all-errors because this step already failed
          # once on a bare "curl: (56) Connection died": a CDN hiccup on a
          # large file, nothing to do with the project. Without
          # --retry-all-errors curl only retries a narrow set of transient
          # HTTP codes and gives up on exactly this class of connection drop.
          fetch() {
            local url="$1" out="$2"
            [ -s "$out" ] && { echo "cached: $out"; return; }
            curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
              --connect-timeout 30 -o "$out" "$url"
          }
          fetch "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip" ~/godot-dl/godot.zip
          fetch "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz" ~/godot-dl/templates.tpz

          unzip -oq ~/godot-dl/godot.zip
          mv Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

          # Templates must land in the exact versioned directory Godot looks
          # in, or the export reports "no export template found" with the
          # templates plainly sitting on disk.
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          unzip -oq ~/godot-dl/templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/

      - name: Generate a debug keystore
        run: |
          set -euo pipefail
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "${GITHUB_WORKSPACE}/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          # Fail here rather than three steps later behind a vague export
          # error, if the keystore did not actually land where it is claimed.
          ls -l "${GITHUB_WORKSPACE}/debug.keystore"

      - name: Point Godot at the Android SDK and keystore
        run: |
          set -euo pipefail
          # The keystore goes through Godot's documented CI environment
          # variables rather than the editor settings file. A hand-written
          # editor_settings-4.tres that Godot declines to parse fails
          # *silently* — it just falls back to defaults — and the resulting
          # export error names no cause at all, which is exactly the dead end
          # the previous run hit. Env vars either apply or are visibly empty.
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=${GITHUB_WORKSPACE}/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

          # The SDK path has no env-var equivalent, so it goes through editor
          # settings — but that write happens *after* the import step below,
          # not here. Godot rewrites this file on every run ("EditorSettings:
          # Save OK!" in the log), so anything written before an intervening
          # godot invocation is silently replaced with defaults, taking the
          # SDK path with it. That is the most likely reason the export kept
          # failing with a configuration error naming nothing at all.

      - name: Import project
        working-directory: godot
        run: |
          # A cold project has no .godot/ cache, and exporting before the
          # importer has run produces an APK missing every imported resource.
          # --import populates it; it exits non-zero on some versions even
          # when it worked, hence the guard.
          godot --headless --import || true

      - name: Install the Android build template
        working-directory: godot
        run: |
          set -euo pipefail
          # The preset sets gradle_build/use_gradle_build=true, which is what
          # an OpenXR/Quest export needs — the plain prebuilt APK template
          # cannot add the OpenXR loader. A gradle build in turn needs the
          # build template unpacked into res://android/, which is a separate
          # step from installing the export templates and fails with
          # "Android build template not installed in the project" if skipped.
          #
          # Unzipped by hand rather than via `godot
          # --install-android-build-template`: that command never returns in
          # headless CI (it hung for 30+ minutes here before being killed,
          # with the step showing no output at all). What it does is entirely
          # mechanical — extract android_source.zip, record the version,
          # drop a .gdignore so the editor does not try to import the Java
          # sources as game assets — so doing it directly is both faster and
          # cannot hang.
          TEMPLATES="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p android/build
          unzip -q "${TEMPLATES}/android_source.zip" -d android/build

          # .build_version must hold Godot's *full* template identifier
          # (e.g. "4.3.stable.official.77dcf97d8"), not the "4.3.stable"
          # directory name. Godot compares this string against its own build
          # identifier and refuses the export on a mismatch. version.txt
          # ships inside the export templates and contains exactly that
          # string, so copying it is both correct and immune to guessing.
          cp "${TEMPLATES}/version.txt" android/.build_version
          echo "build template identifier: $(cat android/.build_version)"

          touch android/build/.gdignore
          ls android/build | head

      - name: Smoke test
        working-directory: godot
        run: |
          set -euo pipefail
          # Constructs the whole scene headlessly and steps the games. Godot
          # parses every script it loads, so this catches parse errors,
          # unknown methods on typed variables and bad property names — the
          # class of failure that has cost the most CI round trips here —
          # before the far slower gradle export runs.
          godot --headless --script res://scripts/smoke.gd

      - name: Write editor settings, after the last godot run that could clobber them
        run: |
          set -euo pipefail
          SETTINGS=~/.config/godot/editor_settings-4.tres
          mkdir -p ~/.config/godot

          # Patch the file Godot itself generated rather than replacing it:
          # a hand-written .tres that Godot declines to parse falls back to
          # defaults *silently*, which is indistinguishable from these
          # settings simply not applying.
          # The keystore is set here as well as through the environment
          # variables above: those are only honoured by newer Godot versions,
          # and on 4.3 an unset debug keystore is one of the checks that can
          # fail the export. Setting both costs nothing and removes a
          # version-dependent guess.
          if [ -f "$SETTINGS" ]; then
            python3 - "$SETTINGS" "$ANDROID_SDK_ROOT" "$JAVA_HOME" "$GITHUB_WORKSPACE/debug.keystore" <<'PY'
          import re, sys
          path, sdk, jdk, keystore = sys.argv[1:5]
          text = open(path).read()
          for key, value in (("export/android/android_sdk_path", sdk),
                             ("export/android/java_sdk_path", jdk),
                             ("export/android/debug_keystore", keystore),
                             ("export/android/debug_keystore_user", "androiddebugkey"),
                             ("export/android/debug_keystore_pass", "android")):
              line = f'{key} = "{value}"'
              if re.search(rf'^{re.escape(key)}\s*=', text, re.M):
                  text = re.sub(rf'^{re.escape(key)}\s*=.*$', line, text, flags=re.M)
              else:
                  text = text.replace("[resource]", "[resource]\n" + line, 1)
          open(path, "w").write(text)
          PY
          else
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' \
              "$ANDROID_SDK_ROOT" "$JAVA_HOME" "$GITHUB_WORKSPACE/debug.keystore" > "$SETTINGS"
          fi

          # Assert it stuck. A silently-empty SDK path is the whole failure
          # mode being chased here, so it is not something to take on faith.
          grep -n "android_sdk_path\|java_sdk_path\|debug_keystore" "$SETTINGS"
          grep -q "android_sdk_path = \"${ANDROID_SDK_ROOT}\"" "$SETTINGS"

      - name: Export APK
        working-directory: godot
        run: |
          set -euo pipefail
          mkdir -p ../build
          # --verbose because the previous failure printed "Cannot export
          # project due to configuration errors:" followed by an empty list,
          # which says nothing actionable. Verbose output names the check
          # that actually failed.
          # On failure, probe the variants that isolate *which* precondition
          # is unmet, rather than spending one CI round per hypothesis. The
          # export error names nothing (it prints an empty list), so the
          # information has to come from which variants succeed:
          #   - release exporting but debug not  => the debug keystore
          #   - non-gradle exporting but gradle not => the build template
          # Each probe prints its own outcome and the step still fails.
          if ! godot --headless --verbose --export-debug "Quest" ../build/kaisei.apk; then
            echo "::group::probe: state"
            cat android/.build_version || true
            ls -la android/build/build.gradle || true
            ls -la "$GITHUB_WORKSPACE/debug.keystore" || true
            grep -n "sdk_path\|keystore" ~/.config/godot/editor_settings-4.tres || true
            echo "::endgroup::"

            echo "::group::probe: --export-release"
            godot --headless --export-release "Quest" ../build/probe-release.apk \
              && echo "PROBE: release export SUCCEEDED (debug keystore is the blocker)" \
              || echo "PROBE: release export also failed"
            echo "::endgroup::"

            echo "::group::probe: gradle build disabled"
            sed -i 's|gradle_build/use_gradle_build=true|gradle_build/use_gradle_build=false|' export_presets.cfg
            godot --headless --export-debug "Quest" ../build/probe-nogradle.apk \
              && echo "PROBE: non-gradle export SUCCEEDED (gradle/build template is the blocker)" \
              || echo "PROBE: non-gradle export also failed"
            echo "::endgroup::"
            exit 1
          fi
          ls -la ../build/

      - uses: actions/upload-artifact@v4
        with:
          name: kaisei-quest-apk
          path: build/kaisei.apk
          if-no-files-found: error
