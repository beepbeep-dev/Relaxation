name: Build and deploy to GitHub Pages

# Fires on every branch rather than a hardcoded one. A branch filter of
# [main] silently never runs in a repository whose default branch is named
# something else — which is exactly what happened here, so the deploy looked
# configured while nothing had ever been built. Branch selection is enforced
# on the deploy job instead, against the repository's real default branch.
on:
  push:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Also switches the Pages source to GitHub Actions if the repository is
      # still on the legacy "deploy from a branch" mode. Without this the
      # branch builder keeps publishing the repo root, whose index.html points
      # at unbundled source the browser cannot execute.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - run: npm run build

      # Verification runs against the built output, so a deploy cannot ship a
      # bundle whose world fails to construct or whose draw calls regressed.
      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npm run smoke

      # Serves the bundle from a project subpath the way Pages actually will.
      # A root-served preview cannot catch an absolute asset URL, because "/"
      # makes every one of them work.
      - name: Verify the bundle boots under a Pages subpath
        run: npm run pages-check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Publish only from the default branch, whatever it happens to be named.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
